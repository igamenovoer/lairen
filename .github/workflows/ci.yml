name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true
      - name: Tests
        run: pixi run test
      - name: Lint
        run: pixi run lint
      - name: Typecheck
        run: pixi run typecheck
