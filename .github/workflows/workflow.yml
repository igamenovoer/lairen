name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.81.0
          cache: true
          run-install: true
      - name: Build distributions
        run: pixi run build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
